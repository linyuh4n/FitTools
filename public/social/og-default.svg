<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7faf8" />
      <stop offset="100%" style="stop-color:#eef3f0" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a36a" />
      <stop offset="100%" style="stop-color:#087a4b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accent)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="url(#accent)" opacity="0.05"/>

  <!-- Logo -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="url(#accent)"/>
    <path d="M0 -20L-38 5 38 5zM-38 35l38 19 38-19M-38 0l38 19 38-19" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="white">FitTools</text>
  </g>

  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#17211b" text-anchor="middle">Ferramentas Gratuitas para Fitness</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="system-ui, sans-serif" font-size="24" fill="#647067" text-anchor="middle">Proteína • IMC • Calorias • Nutrição</text>

  <!-- Badge -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="url(#accent)"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white">Sem cadastro • Privacidade • Baseado em ciência</text>
  </g>

  <!-- URL -->
  <text x="600" y="570" font-family="system-ui, sans-serif" font-size="18" fill="#9aa4a0" text-anchor="middle">fittools.com.br</text>
</svg>
